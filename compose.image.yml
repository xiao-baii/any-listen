services:
  any-listen:
    image: any-listen:${ANYLISTEN_TAG:?Set ANYLISTEN_TAG to the imported image tag}
    pull_policy: never
    ports:
      - '127.0.0.1:9500:9500'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the website origin}
      ACCOUNT_IDLE_MS: 300000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/server/data
    restart: unless-stopped
    stop_grace_period: 30s
