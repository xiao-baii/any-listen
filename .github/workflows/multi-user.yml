name: Multi User
on:
  push:
    branches: [multi-user]
    tags: ['multi-user-v*']
  pull_request:
    branches: [multi-user]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SKIP_LIB_COPY: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @shared/eslint exec tsc -p ../../web-server/tsconfig.accounts.json
      - run: SKIP_LIB_COPY= pnpm build:web
      - run: node packages/web-server/tests/run.cjs
      - run: node packages/web-server/tests/run.cjs startup.test.ts
      - run: node packages/web-server/tests/run.cjs database.test.ts
      - run: node packages/web-server/tests/run.cjs sharedSources.test.ts
      - run: node packages/web-server/tests/run.cjs player.test.ts
      - run: node packages/web-server/tests/run.cjs musicList.test.ts
      - name: Test supported official extensions
        run: |
          mkdir -p work/extension-packages/loader work/extension-packages/metadata
          curl --fail --location --retry 3 https://github.com/any-listen/any-listen-extension-lx-api-source-loader/releases/download/v0.1.7/lx-api-source-loader_v0.1.7.alix -o work/loader.alix
          curl --fail --location --retry 3 https://github.com/any-listen/any-listen-extension-online-metadata/releases/download/v0.4.4/online-metadata_v0.4.4.alix -o work/metadata.alix
          echo 'c4bd2f58a63e8774ed329e1bec75cae45bbc3ac37dede40d73cece66dd862377  work/loader.alix' | sha256sum -c -
          echo '3dd55d395b2150263e9db2db1e7141581149b4038e436e0d7286171fb2b3d787  work/metadata.alix' | sha256sum -c -
          tar -xzf work/loader.alix -C work/extension-packages/loader
          tar -xzf work/metadata.alix -C work/extension-packages/metadata
          tar -xzf work/extension-packages/loader/ext.tgz -C work/extension-packages/loader
          tar -xzf work/extension-packages/metadata/ext.tgz -C work/extension-packages/metadata
          ACCOUNT_EXTENSION_PACKAGES="$PWD/work/extension-packages" node packages/web-server/tests/run.cjs extensions.test.ts
      - run: pnpm -F @shared/scripts build:desktop
  image:
    needs: checks
    if: github.repository == 'xiao-baii/any-listen' && (startsWith(github.ref, 'refs/tags/multi-user-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/multi-user'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multi-user
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/any-listen-linux-amd64.tar
          tags: |
            any-listen:${{ github.ref_name }}
            any-listen:sha-${{ github.sha }}
      - name: Verify exported image and prepare download
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker load -i "$RUNNER_TEMP/any-listen-linux-amd64.tar"
          docker image inspect "any-listen:$IMAGE_TAG" --format '{{.Os}}/{{.Architecture}}'
          cp compose.image.yml "$RUNNER_TEMP/compose.image.yml"
          printf 'ANYLISTEN_TAG=%s\nPUBLIC_ORIGIN=https://music.example.com\nADMIN_USERNAME=admin\nADMIN_PASSWORD=\n' "$IMAGE_TAG" > "$RUNNER_TEMP/.env"
          cp docs/image-import.md "$RUNNER_TEMP/README.md"
          cd "$RUNNER_TEMP"
          sha256sum any-listen-linux-amd64.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: any-listen-${{ github.ref_name }}-linux-amd64
          path: |
            ${{ runner.temp }}/any-listen-linux-amd64.tar
            ${{ runner.temp }}/compose.image.yml
            ${{ runner.temp }}/.env
            ${{ runner.temp }}/README.md
            ${{ runner.temp }}/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
