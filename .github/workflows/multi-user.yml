name: Multi User
on:
  push:
    branches: [multi-user]
    tags: ['multi-user-v*']
  pull_request:
    branches: [multi-user]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      official: ${{ steps.version.outputs.official }}
    env:
      SKIP_LIB_COPY: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e 'const {isRelease} = require("./scripts/ghcr-release.cjs"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `official=${isRelease(process.env.REF_NAME)}\n`)'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm run verify-notes
      - run: node --test scripts/ghcr-release.test.cjs
      - run: npm run test:singer
      - run: npm run test:singer-extension
      - run: npm run build:singer-extension
      - run: pnpm -F @shared/eslint exec tsc -p ../../web-server/tsconfig.accounts.json
      - run: SKIP_LIB_COPY= pnpm build:web
      - run: node packages/web-server/tests/run.cjs
      - run: node packages/web-server/tests/run.cjs startup.test.ts
      - run: node packages/web-server/tests/run.cjs database.test.ts
      - run: node packages/web-server/tests/run.cjs sharedSources.test.ts
      - run: node packages/web-server/tests/run.cjs singerExtension.test.ts
      - run: node packages/web-server/tests/run.cjs player.test.ts
      - run: node packages/web-server/tests/run.cjs musicList.test.ts
      - name: Test supported official extensions
        run: |
          mkdir -p work/extension-packages/loader work/extension-packages/metadata
          curl --fail --location --retry 3 https://github.com/any-listen/any-listen-extension-lx-api-source-loader/releases/download/v0.1.7/lx-api-source-loader_v0.1.7.alix -o work/loader.alix
          curl --fail --location --retry 3 https://github.com/any-listen/any-listen-extension-online-metadata/releases/download/v0.4.4/online-metadata_v0.4.4.alix -o work/metadata.alix
          echo 'c4bd2f58a63e8774ed329e1bec75cae45bbc3ac37dede40d73cece66dd862377  work/loader.alix' | sha256sum -c -
          echo '3dd55d395b2150263e9db2db1e7141581149b4038e436e0d7286171fb2b3d787  work/metadata.alix' | sha256sum -c -
          tar -xzf work/loader.alix -C work/extension-packages/loader
          tar -xzf work/metadata.alix -C work/extension-packages/metadata
          tar -xzf work/extension-packages/loader/ext.tgz -C work/extension-packages/loader
          tar -xzf work/extension-packages/metadata/ext.tgz -C work/extension-packages/metadata
          ACCOUNT_EXTENSION_PACKAGES="$PWD/work/extension-packages" node packages/web-server/tests/run.cjs extensions.test.ts
      - run: pnpm -F @shared/scripts build:desktop
  build-image:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multi-user
          platforms: linux/amd64
          push: false
  image:
    needs: checks
    if: github.repository == 'xiao-baii/any-listen' && github.event_name == 'push' && github.ref_type == 'tag' && needs.checks.outputs.official == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-multi-user-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Protect existing release tags
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ghcr-release.cjs prepare
      - uses: docker/build-push-action@v6
        id: build
        if: steps.prepare.outputs.build == 'true'
        with:
          context: .
          file: Dockerfile.multi-user
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/xiao-baii/any-listen:${{ github.ref_name }}
            ghcr.io/xiao-baii/any-listen:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/xiao-baii/any-listen
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published image and advance rolling tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/ghcr-release.cjs publish
